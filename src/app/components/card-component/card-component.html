<!-- A real button: focusable, Enter/Space click it (the host's (click) handler picks that up). -->
<!-- The plain back is the placeholder until the picture arrives (no artwork, no flip: thousands of cards). -->
<button type="button" class="card-item" appCardTilt [attr.aria-label]="card() | cardTitle"
    [attr.aria-pressed]="selectedCard() && selectedCard()?.id === card()?.id"
    [class.selected-card]="selectedCard() && selectedCard()?.id === card()?.id"
    [class.not-selected-card]="selectedCard() && selectedCard()?.id !== card()?.id">
    <app-card-back class="card-back" [side]="card()?.side_id" [art]="false"></app-card-back>
    @if (card(); as c) {
    <app-card-image [card]="c" [size]="imageSize()" [title]="c | cardTitle"></app-card-image>
    }
    <div class="card-glare"></div>
</button>
