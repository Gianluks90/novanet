<div class="card-item"
                [class.selected-card]="selectedCard() && selectedCard()?.id === card()?.id"
                [class.not-selected-card]="selectedCard() && selectedCard()?.id !== card()?.id" [id]="card()?.id">
                <img loading="lazy" [src]="'https://card-images.netrunnerdb.com/v2/large/' + card()?.id + '.jpg'" alt="">
            </div>
