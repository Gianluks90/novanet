@let isLight = (currentTheme | async) === 'light';
<button type="button" class="header-btn" [attr.aria-label]="(isLight ? 'header.themeDark' : 'header.themeLight') | t"
    [title]="(isLight ? 'header.themeDark' : 'header.themeLight') | t" (click)="toggleTheme()">
    <span class="material-symbols-rounded" aria-hidden="true">{{ isLight ? 'bedtime' : 'sunny' }}</span>
</button>
