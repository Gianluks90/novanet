<div class="theme-toggle-main-container" [style.color]="'var(--accent-color)'">
    @let isLight = (currentTheme | async) === 'light';
    <app-ui-icon-button [icon]="isLight ? 'bedtime' : 'sunny'"
        [label]="(isLight ? 'header.themeDark' : 'header.themeLight') | t" (click)="toggleTheme()"></app-ui-icon-button>
</div>
