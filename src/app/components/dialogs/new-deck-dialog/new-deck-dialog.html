<app-ui-dialog-container [dialogTitle]="'newDeckDialog.newDeck' | t">
    <p>{{ 'newDeckDialog.fillInTheFieldsBelow' | t }}</p>
    <br>
    @if (identities.length === 0) {
        <p>Loading identities...</p>
    } @else {
        <form [formGroup]="form" class="form-container">
        <div class="form-group">
            <label for="side">{{ 'sideLabel' | t }}</label>
            <select name="side" id="side-select" formControlName="side">
                <!-- <option i18n value="all">All Sides</option> -->
                @for(side of sides; track side.id) {
                    <option [value]="side.id">{{ side.name }}</option>
                }
        </select>
        </div>
        <div class="form-group">
            <label for="identity">{{ 'identityLabel' | t }}</label>
            <select name="identity" id="identity-select" formControlName="identity">
                <option value="">{{ 'selectIdentityOption' | t }}</option>
                @for(card of identities; track card.id) {
                    <option [value]="card.id">{{ card | cardTitle }}</option>
                }
            </select>
        </div>
        <div class="form-group">
            <label for="name">{{ 'nameLabel' | t }}</label>
            <input type="text" id="name" formControlName="name" [placeholder]="'enterTextPlaceholder' | t" autocorrect="off" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="customBackImageURL">{{ 'customBackImageURLLabel' | t }}</label>
            <input type="text" id="customBackImageURL" formControlName="customBackImageURL" [placeholder]="'enterURLValidPlaceholder' | t" autocorrect="off" autocomplete="off">
            <p class="form-hint">{{ 'newDeckDialog.ifYouLeaveThisField' | t }}</p>
        </div>
    </form>
    }
    <div dialog-actions-container>
        <app-ui-button [text]="'saveChangesButton' | t" icon="save" [disabled]="!form.valid || form.pristine" (click)="onSubmit()"></app-ui-button>
        <app-ui-button [text]="'closeButton' | t" icon="close" (click)="dialogRef.close()"></app-ui-button>
    </div>
</app-ui-dialog-container>
