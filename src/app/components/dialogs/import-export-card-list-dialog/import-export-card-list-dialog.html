<app-ui-dialog-container [dialogTitle]="(data.list ? 'importExportCardListDialog.exportCardList' : 'importExportCardListDialog.importCardList') | t">
    <p [innerHTML]="'importExportCardListDialog.importADeckByPasting' | t: [data.list ? ('importExportCardListDialog.overwriteWarning' | t) : '']" class="p-note"></p>
    <form [formGroup]="form" class="form-container">
            <div class="form-group">
                <label for="cardList">{{ 'importExportCardListDialog.cardList' | t }}</label>
                <textarea id="cardList" formControlName="cardList" rows="10"></textarea>
            </div>
        </form>
    <div dialog-actions-container>
        @if (data.list) {
            <app-ui-button [text]="'importExportCardListDialog.copyToClipboard' | t" icon="content_copy" (click)="copyToClipboard()"></app-ui-button>
        } @else {
            <app-ui-button [text]="'importButton' | t" icon="bottom_panel_close" [disabled]="!form.valid || form.pristine" (click)="onSubmit()"></app-ui-button>
        }
        <app-ui-button [text]="'closeButton' | t" icon="close" (click)="dialogRef.close()"></app-ui-button>
    </div>
</app-ui-dialog-container>
