<app-ui-dialog-container [dialogTitle]="title | t">
    <p>{{ message | t }}</p>
    <div dialog-actions-container>
        <app-ui-button [text]="confirmLabel | t" icon="check" (click)="confirm()"></app-ui-button>
        <app-ui-button [text]="'closeButton' | t" icon="close" (click)="dialogRef.close()"></app-ui-button>
    </div>
</app-ui-dialog-container>
