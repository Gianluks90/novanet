<app-ui-dialog-container [dialogTitle]="'confirmDialog.confirm' | t">
    <p>{{ 'confirmDialog.pressConfirmIfYouWish' | t }}</p>
    <div dialog-actions-container>
        <app-ui-button [text]="'confirmDialog.confirm' | t" icon="check" (click)="confirm()"></app-ui-button>
        <app-ui-button [text]="'closeButton' | t" icon="close" (click)="dialogRef.close()"></app-ui-button>
    </div>
</app-ui-dialog-container>
