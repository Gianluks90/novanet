<div class="header-main-container">
    <a class="logo-link" routerLink="/" [attr.aria-label]="'header.home' | t" [title]="'header.home' | t">
        <div class="logo" [style.background-color]="'var(--accent-color)'"
            [style.mask]="'url(./images/logo/novanet.svg) no-repeat center / contain'"
            [style.-webkit-mask]="'url(./images/logo/novanet.svg) no-repeat center / contain'"></div>
    </a>

    <nav class="main-nav">
        <a class="nav-link nav-cards" routerLink="/cards" routerLinkActive="active">
            <span class="material-symbols-rounded" aria-hidden="true">cards_stack</span>
            {{ 'nav.cards' | t }}
        </a>
        <a class="nav-link nav-decks" routerLink="/decks" routerLinkActive="active">
            <span class="material-symbols-rounded" aria-hidden="true">stack_hexagon</span>
            {{ 'nav.decks' | t }}
        </a>
        <span class="nav-link nav-play disabled" aria-disabled="true">
            <span class="material-symbols-rounded" aria-hidden="true">group</span>
            {{ 'nav.play' | t }}
            <app-ui-badge [label]="'header.comingSoon' | t"></app-ui-badge>
        </span>
    </nav>

    <section class="action-section">
        @if (firebase.$user()) {
            <button type="button" class="ghost-btn avatar-btn" [cdkMenuTriggerFor]="userMenu"
                [attr.aria-label]="'header.userMenu' | t" [title]="userName">
                @if (avatarUrl) {
                    <img class="avatar" [src]="avatarUrl" alt="" referrerpolicy="no-referrer">
                } @else {
                    <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
                }
            </button>
        } @else {
            <button type="button" class="ghost-btn sign-in-btn" (click)="signIn()">
                <span class="material-symbols-rounded" aria-hidden="true">login</span>
                <span class="sign-in-label">{{ 'header.signInOrRegister' | t }}</span>
            </button>
        }

        <button type="button" class="ghost-btn settings-btn" (click)="openSettings()"
            [attr.aria-label]="'header.settings' | t" [title]="'header.settings' | t">
            <span class="material-symbols-rounded" aria-hidden="true">settings</span>
        </button>
    </section>
</div>

<ng-template #userMenu>
    <div class="ui-menu" cdkMenu>
        <p class="ui-menu-title">{{ userName }}</p>
        <button type="button" class="ui-menu-item" cdkMenuItem (cdkMenuItemTriggered)="openAccount()">
            <span class="material-symbols-rounded" aria-hidden="true">manage_accounts</span>
            {{ 'header.account' | t }}
            @if (unverified) {
                <app-ui-badge icon="warning" tone="warn" [iconOnly]="true" [label]="'account.unverified' | t"></app-ui-badge>
            }
        </button>
        <button type="button" class="ui-menu-item" cdkMenuItem (cdkMenuItemTriggered)="signOut()">
            <span class="material-symbols-rounded" aria-hidden="true">logout</span>
            {{ 'header.signOut' | t }}
        </button>
    </div>
</ng-template>
