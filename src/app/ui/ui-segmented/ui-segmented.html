<div class="ui-segmented" [class.sm]="size() === 'sm'" role="radiogroup" [attr.aria-label]="groupLabel() ? (groupLabel()! | t) : null">
    @for (option of options(); track option.value; let i = $index) {
        <button type="button" role="radio" class="segment" [class.selected]="option.value === value()"
            [attr.aria-checked]="option.value === value()" [attr.tabindex]="isTabStop(i) ? 0 : -1"
            (click)="select(option.value)" (keydown)="onKeydown($event, i)">
            @if (option.icon) {
                <span class="material-symbols-rounded" aria-hidden="true">{{ option.icon }}</span>
            }
            <span>{{ option.label | t }}</span>
        </button>
    }
</div>
