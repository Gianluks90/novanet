<div class="ui-segmented" [class.sm]="size() === 'sm'" [class.fill]="fill()" role="radiogroup" [attr.aria-label]="groupLabel() ? (groupLabel()! | t) : null">
    @for (option of options(); track option.value; let i = $index) {
        <button type="button" role="radio" class="segment" [class.selected]="option.value === value()"
            [class.swatch]="!!option.color" [style.--swatch]="option.color" [style.--swatch-on]="option.color ? onColor(option.color) : null"
            [attr.aria-checked]="option.value === value()" [attr.tabindex]="isTabStop(i) ? 0 : -1"
            [attr.aria-label]="option.color ? (option.label | t) : null" [title]="option.color ? (option.label | t) : ''"
            (click)="select(option.value)" (keydown)="onKeydown($event, i)">
            @if (option.color) {
                <span class="material-symbols-rounded swatch-check" aria-hidden="true">{{ option.value === value() ? 'check' : '' }}</span>
            } @else {
                @if (option.icon) {
                    <span class="material-symbols-rounded" aria-hidden="true">{{ option.icon }}</span>
                }
                <span>{{ option.label | t }}</span>
            }
        </button>
    }
</div>
